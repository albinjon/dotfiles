# REQUIRED BY THE ML4W SETTINGS APP
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

# general {
#     ignore_dbus_inhibit = false
# }

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    # NOTE: hyprctl dispatch takes Lua now that hyprland.lua is the config.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # to avoid having to press a key twice to turn on the display.
}

# Screenlock
listener {
    # HYPRLOCK TIMEOUT
    timeout = 600
    # HYPRLOCK ONTIMEOUT
    on-timeout = loginctl lock-session
}

# dpms
listener {
    # DPMS TIMEOUT
    timeout = 660
    # DPMS ONTIMEOUT
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    # DPMS ONRESUME
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

